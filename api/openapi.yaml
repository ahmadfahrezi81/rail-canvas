openapi: 3.0.3
info:
  title: Rail Canvas API
  version: 0.2.0

# Inlined per response (not components/responses) so every generated error type has one shape.
x-error-response: &error
  description: Error
  content:
    application/json:
      schema: { $ref: "#/components/schemas/Error" }

x-space-id: &spaceId
  name: spaceId
  in: path
  required: true
  schema: { type: string, format: uuid }

security:
  - bearer: []

paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": *error
        "401": *error
        "429": *error

  /auth/signup:
    post:
      operationId: signup
      description: Create an account with an invite code. The new user joins the code's space.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Signed up and logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": *error
        "409": *error
        "429": *error

  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Logged out }
        "401": *error

  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: The caller and their spaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": *error

  /spaces/join:
    post:
      operationId: joinSpace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinRequest" }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceMembership" }
        "400": *error
        "401": *error
        "429": *error

  /spaces/{spaceId}/invites:
    post:
      operationId: createInvite
      description: Owners only. The code is shown once and never stored in readable form.
      parameters: [*spaceId]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "401": *error
        "403": *error
        "404": *error

  /spaces/{spaceId}/canvases:
    get:
      operationId: listCanvases
      parameters: [*spaceId]
      responses:
        "200":
          description: Canvases in the space, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanvasList" }
        "401": *error
        "404": *error
    post:
      operationId: createCanvas
      parameters: [*spaceId]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCanvasRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Canvas" }
        "400": *error
        "401": *error
        "404": *error

  /spaces/{spaceId}/canvases/{canvasId}/pixels:
    post:
      operationId: placePixel
      description: |
        Place one pixel. One placement per member per space per cooldown.
        Everyone subscribed to the canvas then gets a pixel:placed message.
      parameters:
        - *spaceId
        - name: canvasId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacePixelRequest" }
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacedPixel" }
        "400": *error
        "401": *error
        "404": *error
        "429":
          description: Too soon; try again at nextPlaceAt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CooldownError" }

  /ws/ticket:
    post:
      operationId: createWSTicket
      description: |
        A single-use ticket, valid 30 seconds, to open the WebSocket:
        GET /ws?ticket=... (not described here: an upgrade is not a REST call).
        Messages use WSClientMessage and WSServerMessage.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WSTicket" }
        "401": *error

  /spaces/{spaceId}/canvases/{canvasId}/board:
    get:
      operationId: getCanvasBoard
      description: |
        The whole board: width × height bytes, row by row, one palette index
        per cell. 0 is the background.
      parameters:
        - *spaceId
        - name: canvasId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The board
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": *error
        "404": *error

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Health:
      type: object
      required: [status, env]
      properties:
        status: { type: string }
        env: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    SignupRequest:
      type: object
      required: [code, email, displayName, password]
      properties:
        code: { type: string }
        email: { type: string }
        displayName: { type: string, minLength: 1, maxLength: 32 }
        password: { type: string, minLength: 10, maxLength: 72 }

    JoinRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    User:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: "Send as Authorization: Bearer <token>" }
        user: { $ref: "#/components/schemas/User" }

    SpaceMembership:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, member] }

    Me:
      type: object
      required: [user, spaces]
      properties:
        user: { $ref: "#/components/schemas/User" }
        spaces:
          type: array
          items: { $ref: "#/components/schemas/SpaceMembership" }

    Invite:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }

    Palette:
      type: object
      required: [id, colors]
      properties:
        id: { type: string }
        colors:
          type: array
          description: Hex colors. A cell's byte is an index into this list.
          items: { type: string }

    Canvas:
      type: object
      required: [id, name, width, height, palette, cooldownSeconds, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        width: { type: integer }
        height: { type: integer }
        palette: { $ref: "#/components/schemas/Palette" }
        cooldownSeconds: { type: integer }
        createdAt: { type: string, format: date-time }

    CanvasList:
      type: object
      required: [canvases]
      properties:
        canvases:
          type: array
          items: { $ref: "#/components/schemas/Canvas" }

    CreateCanvasRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        cooldownSeconds: { type: integer, minimum: 1, maximum: 3600, description: "Default 10" }

    PlacePixelRequest:
      type: object
      required: [x, y, color]
      properties:
        x: { type: integer }
        y: { type: integer }
        color: { type: integer, description: Index into the canvas palette }

    PlacedPixel:
      type: object
      required: [pixelId, x, y, color, placedAt, nextPlaceAt]
      properties:
        pixelId: { type: integer, format: int64 }
        x: { type: integer }
        y: { type: integer }
        color: { type: integer }
        placedAt: { type: string, format: date-time }
        nextPlaceAt: { type: string, format: date-time }

    CooldownError:
      type: object
      required: [error, nextPlaceAt]
      properties:
        error: { type: string }
        nextPlaceAt: { type: string, format: date-time }

    WSTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket: { type: string }
        expiresAt: { type: string, format: date-time }

    WSClientMessage:
      type: object
      required: [type, spaceId, canvasId]
      properties:
        type: { type: string, enum: [subscribe, unsubscribe] }
        spaceId: { type: string, format: uuid }
        canvasId: { type: string, format: uuid }

    WSServerMessage:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [subscribed, "pixel:placed", error] }
        canvasId: { type: string, format: uuid }
        pixelId: { type: integer, format: int64 }
        x: { type: integer }
        y: { type: integer }
        color: { type: integer }
        error: { type: string }
