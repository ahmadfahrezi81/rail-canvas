openapi: 3.0.3
info:
  title: Rail Canvas API
  version: 0.9.0

# Inlined per response (not components/responses) so every generated error type has one shape.
x-error-response: &error
  description: Error
  content:
    application/json:
      schema: { $ref: "#/components/schemas/Error" }

x-space-id: &spaceId
  name: spaceId
  in: path
  required: true
  schema: { type: string, format: uuid }

x-canvas-id: &canvasId
  name: canvasId
  in: path
  required: true
  schema: { type: string, format: uuid }

x-webhook-secret: &webhookSecret
  name: X-Webhook-Secret
  in: header
  required: false
  schema: { type: string }

x-template-id: &templateId
  name: templateId
  in: path
  required: true
  schema: { type: string, format: uuid }

security:
  - bearer: []

paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": *error
        "401": *error
        "429": *error

  /auth/signup:
    post:
      operationId: signup
      description: Create an account with an invite code. The new user joins the code's space.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Signed up and logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": *error
        "409": *error
        "429": *error

  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Logged out }
        "401": *error

  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: The caller and their spaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": *error

  /spaces/join:
    post:
      operationId: joinSpace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinRequest" }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceMembership" }
        "400": *error
        "401": *error
        "429": *error

  /spaces/{spaceId}/invites:
    post:
      operationId: createInvite
      description: Owners only. The code is shown once and never stored in readable form.
      parameters: [*spaceId]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "401": *error
        "403": *error
        "404": *error

  /spaces/{spaceId}/canvases:
    get:
      operationId: listCanvases
      parameters: [*spaceId]
      responses:
        "200":
          description: Canvases in the space, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanvasList" }
        "401": *error
        "404": *error
    post:
      operationId: createCanvas
      parameters: [*spaceId]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCanvasRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Canvas" }
        "400": *error
        "401": *error
        "404": *error

  /spaces/{spaceId}/canvases/{canvasId}/pixels:
    post:
      operationId: placePixel
      description: |
        Place one pixel. One placement per member per space per cooldown.
        Everyone subscribed to the canvas then gets a pixel:placed message.
      parameters:
        - *spaceId
        - name: canvasId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacePixelRequest" }
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacedPixel" }
        "400": *error
        "401": *error
        "404": *error
        "429":
          description: Too soon; try again at nextPlaceAt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CooldownError" }

  /ws/ticket:
    post:
      operationId: createWSTicket
      description: |
        A single-use ticket, valid 30 seconds, to open the WebSocket:
        GET /ws?ticket=... (not described here: an upgrade is not a REST call).
        Messages use WSClientMessage and WSServerMessage.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WSTicket" }
        "401": *error

  /spaces/{spaceId}/canvases/{canvasId}/board:
    get:
      operationId: getCanvasBoard
      description: |
        The whole board: width × height bytes, row by row, one palette index
        per cell. 0 is the background.
      parameters:
        - *spaceId
        - name: canvasId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The board
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": *error
        "404": *error

  /spaces/{spaceId}/canvases/{canvasId}/templates:
    get:
      operationId: listTemplates
      description: Ready templates of the canvas, newest first. Each url is signed and expires at urlExpiresAt.
      parameters: [*spaceId, *canvasId]
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateList" }
        "401": *error
        "404": *error
        "503": *error
    post:
      operationId: createTemplate
      description: |
        Start an upload. Returns a signed URL, valid 5 minutes: PUT the file there
        with uploadHeaders, then call complete.
      parameters: [*spaceId, *canvasId]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTemplateRequest" }
      responses:
        "201":
          description: Upload ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateUpload" }
        "400": *error
        "401": *error
        "404": *error
        "409": *error
        "429": *error
        "503": *error

  /spaces/{spaceId}/canvases/{canvasId}/templates/{templateId}/complete:
    post:
      operationId: completeTemplate
      description: Check the uploaded file. Ready, or rejected (422) and the file deleted.
      parameters: [*spaceId, *canvasId, *templateId]
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": *error
        "404": *error
        "409": *error
        "422": *error
        "503": *error

  /spaces/{spaceId}/canvases/{canvasId}/templates/{templateId}:
    delete:
      operationId: deleteTemplate
      description: The uploader or the space's owner.
      parameters: [*spaceId, *canvasId, *templateId]
      responses:
        "204": { description: Deleted }
        "401": *error
        "403": *error
        "404": *error
        "503": *error

  /spaces/{spaceId}/canvases/{canvasId}/snapshots:
    get:
      operationId: listSnapshots
      description: |
        Hourly pictures of the canvas, newest first, the last 48. Taken only in an
        hour the canvas changed. Each url is signed and expires at urlExpiresAt.
      parameters: [*spaceId, *canvasId]
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotList" }
        "401": *error
        "404": *error
        "503": *error

  /spaces/{spaceId}/canvases/{canvasId}/timelapses:
    get:
      operationId: listTimelapses
      description: The canvas's 10 newest timelapse requests, newest first.
      parameters: [*spaceId, *canvasId]
      responses:
        "200":
          description: Timelapses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelapseList" }
        "401": *error
        "404": *error
        "503": *error
    post:
      operationId: createTimelapse
      description: |
        Ask the worker for an animated GIF of the canvas's hourly snapshots (the newest
        240). Answers at once with a pending timelapse; poll the list until it is ready.
        One pending per canvas (409).
      parameters: [*spaceId, *canvasId]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timelapse" }
        "401": *error
        "404": *error
        "409": *error
        "429": *error
        "503": *error

  /spaces/{spaceId}/canvases/{canvasId}/bot-link-code:
    post:
      operationId: createBotLinkCode
      description: |
        A one-time code (10 minutes) that links a chat account (Telegram) to the caller,
        drawing on this canvas. The player sends "/link CODE" to the bot. Linking again
        from another canvas moves the link.
      parameters: [*spaceId, *canvasId]
      responses:
        "201":
          description: Created; the code is shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotLinkCode" }
        "401": *error
        "404": *error
        "429": *error

  /webhooks/bot/link:
    post:
      operationId: webhookBotLink
      description: |
        From our bot Function, not a browser: redeem a link code for a chat account.
        The caller proves itself with X-Webhook-Secret, not a bearer token.
      security: []
      parameters: [*webhookSecret]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BotLinkRequest" }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotLinked" }
        "400": *error
        "401": *error
        "404": *error
        "429": *error
        "503": *error

  /webhooks/bot/pixels:
    post:
      operationId: webhookBotPlacePixel
      description: |
        From our bot Function: place a pixel for a linked chat account, on its linked
        canvas. Same membership check and cooldown as the browser; recorded with source "bot".
      security: []
      parameters: [*webhookSecret]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BotPlaceRequest" }
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotPlacedPixel" }
        "400": *error
        "401": *error
        "404": *error
        "429":
          description: Too soon; try again at nextPlaceAt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CooldownError" }
        "503": *error

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Health:
      type: object
      required: [status, env, commit]
      properties:
        status: { type: string }
        env: { type: string }
        commit: { type: string, description: "The deployed git commit; empty locally" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    SignupRequest:
      type: object
      required: [code, email, displayName, password]
      properties:
        code: { type: string }
        email: { type: string }
        displayName: { type: string, minLength: 1, maxLength: 32 }
        password: { type: string, minLength: 10, maxLength: 72 }

    JoinRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    User:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: "Send as Authorization: Bearer <token>" }
        user: { $ref: "#/components/schemas/User" }

    SpaceMembership:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, member] }

    Me:
      type: object
      required: [user, spaces]
      properties:
        user: { $ref: "#/components/schemas/User" }
        spaces:
          type: array
          items: { $ref: "#/components/schemas/SpaceMembership" }

    Invite:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }

    Palette:
      type: object
      required: [id, colors, names]
      properties:
        id: { type: string }
        colors:
          type: array
          description: Hex colors. A cell's byte is an index into this list.
          items: { type: string }
        names:
          type: array
          description: One name per color, the words the bot accepts (red, darkblue)
          items: { type: string }

    Canvas:
      type: object
      required: [id, name, width, height, palette, cooldownSeconds, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        width: { type: integer }
        height: { type: integer }
        palette: { $ref: "#/components/schemas/Palette" }
        cooldownSeconds: { type: integer }
        createdAt: { type: string, format: date-time }

    CanvasList:
      type: object
      required: [canvases]
      properties:
        canvases:
          type: array
          items: { $ref: "#/components/schemas/Canvas" }

    CreateCanvasRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        cooldownSeconds: { type: integer, minimum: 1, maximum: 3600, description: "Default 10" }
        palette:
          type: string
          enum: [classic16, place32]
          description: "Default classic16 (r/place 2017, 16 colours); place32 is r/place 2022's 32. Fixed for the canvas's life"

    PlacePixelRequest:
      type: object
      required: [x, y, color]
      properties:
        x: { type: integer }
        y: { type: integer }
        color: { type: integer, description: Index into the canvas palette }

    PlacedPixel:
      type: object
      required: [pixelId, x, y, color, placedAt, nextPlaceAt]
      properties:
        pixelId: { type: integer, format: int64 }
        x: { type: integer }
        y: { type: integer }
        color: { type: integer }
        placedAt: { type: string, format: date-time }
        nextPlaceAt: { type: string, format: date-time }

    CooldownError:
      type: object
      required: [error, nextPlaceAt]
      properties:
        error: { type: string }
        nextPlaceAt: { type: string, format: date-time }

    WSTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket: { type: string }
        expiresAt: { type: string, format: date-time }

    WSClientMessage:
      type: object
      required: [type, spaceId, canvasId]
      properties:
        type: { type: string, enum: [subscribe, unsubscribe] }
        spaceId: { type: string, format: uuid }
        canvasId: { type: string, format: uuid }

    WSServerMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [subscribed, "pixel:placed", resync, error]
          description: "resync: events may have been missed (the server lost touch with the other API copies); reload the board. Without canvasId, every canvas"
        canvasId: { type: string, format: uuid }
        pixelId: { type: integer, format: int64 }
        x: { type: integer }
        y: { type: integer }
        color: { type: integer }
        error: { type: string }

    CreateTemplateRequest:
      type: object
      required: [bytes, contentType, x, y]
      properties:
        bytes: { type: integer, minimum: 1, maximum: 1048576 }
        contentType: { type: string, enum: [image/png] }
        x: { type: integer, minimum: 0, maximum: 255, description: Column of the template's top-left cell }
        y: { type: integer, minimum: 0, maximum: 255, description: Row of the template's top-left cell }

    TemplateUpload:
      type: object
      required: [templateId, uploadUrl, uploadHeaders, expiresAt]
      properties:
        templateId: { type: string, format: uuid }
        uploadUrl: { type: string }
        uploadHeaders:
          type: object
          description: Headers the PUT must send exactly.
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }

    Template:
      type: object
      required: [id, x, y, width, height, uploadedBy, createdAt, url, urlExpiresAt]
      properties:
        id: { type: string, format: uuid }
        x: { type: integer }
        y: { type: integer }
        width: { type: integer }
        height: { type: integer }
        uploadedBy:
          type: object
          required: [name]
          properties:
            id: { type: string, format: uuid, description: Absent if the account is gone }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        url: { type: string, description: Signed download URL }
        urlExpiresAt: { type: string, format: date-time }
        thumbUrl:
          type: string
          description: Signed URL of a copy at most 64 × 64, made by the worker. Absent until it exists; show url meanwhile

    Snapshot:
      type: object
      required: [id, takenAt, url, urlExpiresAt]
      properties:
        id: { type: string, format: uuid }
        takenAt: { type: string, format: date-time, description: The hour it was taken }
        url: { type: string, description: The PNG, one pixel per cell }
        urlExpiresAt: { type: string, format: date-time }

    SnapshotList:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          items: { $ref: "#/components/schemas/Snapshot" }

    Timelapse:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, ready, failed] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        frames: { type: integer, description: One per hourly snapshot; when ready }
        error: { type: string, description: Why it failed; when failed }
        url: { type: string, description: Signed URL of the animated GIF; when ready }
        urlExpiresAt: { type: string, format: date-time }

    TimelapseList:
      type: object
      required: [timelapses]
      properties:
        timelapses:
          type: array
          items: { $ref: "#/components/schemas/Timelapse" }

    BotPlatform:
      type: string
      enum: [telegram]

    BotLinkCode:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string, description: "8 characters, shown as K7QM-2PXD" }
        expiresAt: { type: string, format: date-time }

    BotLinkRequest:
      type: object
      required: [platform, platformUserId, code]
      properties:
        platform: { $ref: "#/components/schemas/BotPlatform" }
        platformUserId: { type: string, description: The chat platform's user id }
        code: { type: string }

    BotLinked:
      type: object
      required: [displayName, canvasName]
      properties:
        displayName: { type: string }
        canvasName: { type: string }

    BotPlaceRequest:
      type: object
      required: [platform, platformUserId, x, y, color]
      properties:
        platform: { $ref: "#/components/schemas/BotPlatform" }
        platformUserId: { type: string }
        x: { type: integer }
        y: { type: integer }
        color: { type: string, description: "A colour name from the palette (red) or its index (5)" }

    BotPlacedPixel:
      type: object
      required: [pixelId, x, y, color, colorName, nextPlaceAt]
      properties:
        pixelId: { type: integer, format: int64 }
        x: { type: integer }
        y: { type: integer }
        color: { type: integer }
        colorName: { type: string }
        nextPlaceAt: { type: string, format: date-time }

    TemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: { $ref: "#/components/schemas/Template" }
