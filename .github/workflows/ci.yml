# Every push to staging and main: Railway's "Wait for CI" reads the push run. Not on pull requests:
# a release pull request's commit is the staging commit that already passed here.
name: CI

on:
  push:
    branches: [main, staging]

# Never cancelled: Railway skips a deploy whose run was cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18 # the server's major version
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rail_canvas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2 # Railway's Redis version
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway container, CI only. Tests log in as postgres and SET ROLE app.
      DB_URL: postgres://postgres:postgres@localhost:5432/rail_canvas_test?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - run: go vet ./...
      - name: Migrations on an empty database
        run: MIGRATE_DATABASE_URL="$DB_URL" go run ./cmd/cli migrate
      - name: Tests, database and Redis included
        run: TEST_DATABASE_URL="$DB_URL" TEST_REDIS_URL=redis://localhost:6379 go test -count=1 -race ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: pnpm/action-setup@v6 # version from packageManager in the root package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: make generate
      - name: Generated code matches openapi.yaml and the SQL
        # status, not diff: a newly generated file is untracked and diff would miss it
        run: |
          git diff
          test -z "$(git status --porcelain)" || (git status --porcelain; exit 1)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in the root package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Backup scripts
        run: shellcheck -x -e SC1091 ops/backup/*.sh
      - name: Bot Function tests, in the image Railway runs it on
        run: docker run --rm -v "$PWD/functions/webhook:/src:ro" -w /src --entrypoint bun ghcr.io/railwayapp/function-bun:1.4.0 test
      - name: Backup image
        uses: docker/build-push-action@v7
        with:
          context: ops/backup
          push: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
